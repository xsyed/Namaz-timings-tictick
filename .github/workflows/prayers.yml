name: Update Prayer Reminders

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

jobs:
  update-prayers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run prayers
        env:
          TICKTICK_ACCESS_TOKEN: ${{ secrets.TICKTICK_ACCESS_TOKEN }}
          TICKTICK_PRAYER_PROJECT_ID: ${{ secrets.TICKTICK_PRAYER_PROJECT_ID }}